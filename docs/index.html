<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Oxid-8</title>
    <link rel="stylesheet" href="assets/index.css"/>
  </head>

  <body>

    <div class="container">
      <input id="input" type="file" />
      <canvas id="canvas" width="64" height="32"></canvas>
    </div>

    <div class="container hide">
      <div class="keypad">
        <div><button data-key="Digit1">1</button></div>
        <div><button data-key="Digit2">2</button></div>
        <div><button data-key="Digit3">3</button></div>
        <div><button data-key="Digit4">C</button></div>
        <div><button data-key="KeyQ">4</button></div>
        <div><button data-key="KeyW">5</button></div>
        <div><button data-key="KeyE">6</button></div>
        <div><button data-key="KeyR">D</button></div>
        <div><button data-key="KeyA">7</button></div>
        <div><button data-key="KeyS">8</button></div>
        <div><button data-key="KeyD">9</button></div>
        <div><button data-key="KeyF">E</button></div>
        <div><button data-key="KeyZ">A</button></div>
        <div><button data-key="KeyX">0</button></div>
        <div><button data-key="KeyC">B</button></div>
        <div><button data-key="KeyV">F</button></div>
      </div>
    </div>

  </body>

  <script type="module">
    import init, { key_event } from "./pkg/oxid8_wgpu.js";
    init().then(() => {
      console.log("WASM Loaded");

      document.querySelectorAll("[data-key]").forEach(btn => {
        btn.addEventListener("touchstart", (e) => {
          e.preventDefault();
          btn.classList.add("pressed");
          key_event(btn.dataset.key, true);
        })
        btn.addEventListener("touchend", (e) => {
          e.preventDefault();
          btn.classList.remove("pressed");
          key_event(btn.dataset.key, false);
        })
        btn.addEventListener("click", async (e) => {
          e.preventDefault();
          key_event(btn.dataset.key, true);
          await new Promise(r => setTimeout(r, 500));
          key_event(btn.dataset.key, false);
        })
      })
    });
  </script>

</html>
